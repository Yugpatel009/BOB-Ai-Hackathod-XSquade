# Render Blueprint — CyberSentinel AI SOC Analyst
# Deploy with: https://render.com/deploy

services:
  - type: web
    name: cybersentinel
    runtime: python
    region: oregon
    plan: free
    buildCommand: "sed -i 's/\\r$//' render-build.sh && chmod +x render-build.sh && ./render-build.sh"
    startCommand: "cd src/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.9"
      - key: NODE_VERSION
        value: "20"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: "sqlite:///./cybersentinel.db"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false  # User must set this manually in Render dashboard
      - key: GEMINI_MODEL
        value: "gemini-1.5-flash"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
      - key: CORS_ORIGINS
        value: "*"
