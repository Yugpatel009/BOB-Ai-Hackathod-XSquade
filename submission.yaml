  - name: "yug kansagra"
    role: "member"
    email: "d26dce141@charusar.edu.in"

demo:
  video_url: "https://youtu.be/example-cybersentinel-demo"
  live_url: "https://bob-ai-hackathod-xsquade.onrender.com/"
  api_docs: "https://bob-ai-hackathod-xsquade.onrender.com/docs"

tech_stack:
  backend:
    framework: "FastAPI"
    language: "Python 3.10+"
    orm: "SQLAlchemy 2.0"
    validation: "Pydantic v2"
    database: "SQLite"
  frontend:
    framework: "React 19"
    tooling: "Vite"
    language: "TypeScript"
    styling: "Tailwind CSS"
    charts: "Recharts"
    icons: "Lucide React"
  ai_provider:
    architecture: "Pluggable AIProvider Layer"
    offline_provider: "MockAIProvider (Zero-Key, Deterministic)"
    online_provider: "OpenAICompatibleProvider (Ollama, vLLM, Groq, OpenAI)"

repository_structure:
  src:
    backend: "src/backend"
    frontend: "src/frontend"
    shared: "src/shared"
  docs: "docs"
  demo: "demo"
  presentation: "presentation"
