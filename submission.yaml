# Hackathon Project Submission Metadata
project_name: "CyberSentinel"
tagline: "AI-Powered SOC Analyst — Autonomous Threat Detection, Correlation & Incident Response"
team_name: "CyberSentinel AI"
track: "AI / Cybersecurity"

description: >
  Autonomous Security Operations Center assistant that detects, correlates, investigates,
  scores risk, and recommends prescriptive response actions for enterprise security incidents.

team_members:
  - name: "jenil Sakhiya"
    role: "Team Lead"
    email: "25ce104@charusar.edu.in"
  - name: "Daksh Patel"
    role: "member"
