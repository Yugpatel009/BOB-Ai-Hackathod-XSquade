submission:
  title: "CyberSentinel"

  problem_statement: >
    Modern enterprise Security Operations Centers (SOC) are overwhelmed by alert fatigue, processing thousands of disconnected security logs daily. Tier-1 analysts struggle to detect correlated multi-stage attack campaigns, synthesize threat intelligence, and take rapid containment actions before data exfiltration occurs.

  solution_summary: >
    CyberSentinel is an autonomous AI-powered SOC analyst that ingests and correlates telemetry events into high-fidelity incidents, computes dynamic MITRE ATT&CK risk scores, generates automated forensic root-cause investigations, and enables single-click defensive response playbooks.

  key_features:
    - "Multi-Stage Attack Correlation & MITRE ATT&CK Matrix Mapping"
    - "Autonomous AI Forensic Investigation & Root Cause Synthesis"
    - "Interactive SOC AI Chat Assistant with Live Telemetry Context"
    - "Real-time Attack Simulation Sandbox (Brute Force, Lateral Movement, Data Exfiltration)"
    - "Automated Incident Risk Scoring & One-Click Containment Playbooks"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "Tailwind CSS", "Vite"]
    ibm_technologies: ["watsonx.ai", "IBM Bob"]
    databases: ["SQLite", "SQLAlchemy"]
    other: ["Docker", "Uvicorn", "Recharts", "Lucide React"]

  what_we_are_most_proud_of: >
    The end-to-end incident response lifecycle: from simulating live multi-vector attacks in the sandbox, to sub-second correlation, AI-driven root-cause synthesis with MITRE ATT&CK mapping, and instant containment execution directly through an intuitive Command Center.

  known_limitations: >
    Currently relies on simulated telemetry and standard SIEM schema formats. Real-world enterprise deployment would integrate continuous Kafka streaming and bidirectional integrations with commercial EDRs like CrowdStrike and Microsoft Sentinel.

